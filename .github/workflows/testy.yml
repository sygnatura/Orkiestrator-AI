# Both test suites (installer, kier.py, consistency; Codex package) on every OS the owner and agents use,
# plus the Claude part on the macOS system Python.
name: testy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Full history: installer tests read earlier releases with `git show <sha>:<path>`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Wersje
        run: |
          git --version
          python --version
      - name: Testy (instalator, kier.py, spójność)
        run: python -m unittest discover -s tests -v
      - name: Testy pakietu Codex
        run: python -m unittest discover -s codex/tests -v

  # Python z Command Line Tools macOS (3.9) — ten, który kierownik woła jako `python3` na Macu bez Homebrew.
  # Część Claude (instalator, kier.py) musi na nim działać; testy części Codex (3.11+) są tu pomijane.
  macos-systemowy-python:
    runs-on: macos-latest
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Wersje
        run: |
          git --version
          /usr/bin/python3 --version
      - name: Testy części Claude (instalator, kier.py, spójność)
        working-directory: tests
        run: /usr/bin/python3 -m unittest test_install test_kier test_spojnosc -v
